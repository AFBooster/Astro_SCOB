name: Check the outside data sources

# WHY THIS EXISTS
# ---------------
# Much of the site depends on services it does not control: NEA (data.gov.sg) for haze,
# Open-Meteo for cloud, rain and the haze forecast, NASA GIBS and MSS for satellite and
# radar pictures, CelesTrak for satellite passes, NOAA/SDO for the Sun. When one of them
# moves or changes its reply, the pages fall back quietly to "no data" — nothing errors,
# so nobody notices until a Friday.
#
# Once a week this runs .github/scripts/check-sources.js, which loads the site's own
# haze-core.js and calls each source the way a visitor's browser would.
#   * Anything failing  -> opens an issue titled "Data source check failing" (or adds a
#                          comment to the one already open), listing which pages are affected.
#                          GitHub e-mails the repo owner about new issues by default.
#   * Everything passes -> closes that issue again, if one is open.
# The full table is always in the run's summary page (Actions tab -> this workflow).
# Run it by hand any time from the Actions tab with "Run workflow".

on:
  schedule:
    - cron: '17 1 * * 1'       # Mondays 01:17 UTC = 09:17 SGT — a working morning, four days before Friday
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: check-sources
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04      # pinned, as in the other workflows
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Probe every source
        id: probe
        continue-on-error: true
        run: node .github/scripts/check-sources.js --md report.md

      - name: Open or update the issue when something is failing
        if: steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Data source check failing"
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          { cat report.md; echo; echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } > body.md
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi

      - name: Close the issue once everything passes again
        if: steps.probe.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state open --search 'in:title "Data source check failing"' --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "All sources answered again on $(TZ=Asia/Singapore date '+%d %b %Y %H:%M') SGT. Closing."
          fi

      - name: Mark the run red when something failed
        if: steps.probe.outcome == 'failure'
        run: exit 1
