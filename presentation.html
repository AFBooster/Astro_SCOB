<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Foyer Display — SCOB Night-Sky</title>
<link rel="stylesheet" href="scob-theme.css">
<style>
:root{--ink:#ffffff;--accent:#ffd23f;--dim:#b9c4dd;}
html,body{height:100%;}
body{margin:0;background:#000;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overflow:hidden;}
.stage{height:100vh;display:flex;flex-direction:column;}
/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:16px 24px;flex:0 0 auto;}
.brand{font-size:clamp(16px,2.4vw,24px);font-weight:800;color:var(--accent);letter-spacing:.01em;}
.brand small{color:var(--dim);font-weight:600;font-size:.62em;display:block;}
.clock{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;font-size:clamp(16px,2.2vw,24px);color:#fff;}
.ctrls{display:flex;gap:8px;}
.ctrls button{background:#0e1730;color:#dfe7fb;border:2px solid #2a3a63;border-radius:10px;font-size:16px;font-weight:800;padding:8px 13px;cursor:pointer;}
.ctrls button:hover{border-color:var(--accent);}
/* slide */
.slide{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:clamp(20px,4vw,60px);padding:0 clamp(20px,5vw,80px);}
@media(max-width:820px){.slide{flex-direction:column;gap:18px;text-align:center;}}
.art{flex:0 0 auto;width:clamp(150px,26vw,340px);height:clamp(150px,26vw,340px);}
.art svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 30px rgba(120,150,255,.25));}
.info{max-width:min(60ch,60vw);}
.kicker{font-size:clamp(14px,1.8vw,20px);font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);}
.name{font-size:clamp(34px,7vw,84px);font-weight:900;line-height:1.02;margin:6px 0 14px;color:#fff;}
.where{font-size:clamp(20px,3.2vw,38px);font-weight:800;color:#8fe3ff;margin-bottom:16px;}
.where .deg{color:#fff;}
.blurb{font-size:clamp(17px,2.3vw,28px);line-height:1.4;color:#eef2fb;}
.scope{margin-top:16px;font-size:clamp(15px,2vw,24px);font-weight:800;color:#8affc0;}
/* bottom */
.foot{flex:0 0 auto;padding:14px 24px 20px;}
.tick{font-size:clamp(16px,2.4vw,30px);font-weight:800;text-align:center;color:#fff;}
.tick .hl{color:var(--accent);}
.progress{height:8px;border-radius:6px;background:#16203c;overflow:hidden;margin-top:12px;}
.progress .fill{height:100%;background:linear-gradient(90deg,#8fe3ff,#ffd23f);width:0%;}
.empty{margin:auto;text-align:center;max-width:60ch;padding:0 24px;}
.empty .big{font-size:clamp(28px,5vw,56px);font-weight:900;color:#fff;margin-bottom:12px;}
.empty p{font-size:clamp(17px,2.4vw,26px);color:var(--dim);}
.hidden{display:none!important;}
</style>
</head>
<body>
<div class="stage">
  <div class="top">
    <div class="brand">🔭 Science Centre Observatory<small>Tonight's sky — live</small></div>
    <div class="clock" id="clock">—</div>
    <div class="ctrls">
      <button type="button" id="prev" aria-label="Previous">‹</button>
      <button type="button" id="play" aria-label="Play or pause">⏸</button>
      <button type="button" id="next" aria-label="Next">›</button>
      <button type="button" id="full" aria-label="Full screen">⛶</button>
    </div>
  </div>

  <div class="slide" id="slide"></div>

  <div class="foot">
    <div class="tick" id="tick">Come and look through our telescopes 🔭</div>
    <div class="progress"><div class="fill" id="fill"></div></div>
  </div>
</div>
<span class="scob-version" style="display:none"></span>
<script src="astro-core.js"></script>
<script>
(function(){
  var A=window.Astro;
  var slideEl=document.getElementById('slide'), tickEl=document.getElementById('tick'), fillEl=document.getElementById('fill');
  var TICKS=["Come and look through our telescopes 🔭","Ask a volunteer what's in the eyepiece ✨","Everything you see is real light — some of it thousands of years old 🌌","Grab a <span class='hl'>Stargazer's Passport</span> and tick off what you spot 🪪"];
  var items=[], idx=0, playing=true, timer=null, tickTimer=null, tickI=0, SLIDE_MS=12000;

  function sgtNow(){var n=new Date();return new Date(n.getTime()+(n.getTimezoneOffset()+480)*60000);}
  function compute(){
    var now=new Date(), s=A.sky(now);
    var SP=(A.SHOWPIECES||[]).concat(A.activeComets?A.activeComets(now):[]);
    var out=[];
    SP.forEach(function(sp){
      var p=A.positionOf(sp,now);
      var minA=(sp.kind==='planet'||sp.kind==='moon')?5:12;
      var needDark=!(sp.kind==='planet'||sp.kind==='moon');
      if(p.alt>minA && (!needDark || s.sunAlt<-6)) out.push({sp:sp,p:p});
    });
    // brightest / highest first-ish: sort planets+moon first, then by altitude
    out.sort(function(a,b){
      var ra=(a.sp.kind==='planet'||a.sp.kind==='moon')?0:1, rb=(b.sp.kind==='planet'||b.sp.kind==='moon')?0:1;
      if(ra!==rb)return ra-rb; return b.p.alt-a.p.alt;});
    return out;
  }
  function altWord(a){return a<20?'low':(a<50?'well up':'high overhead');}
  function firstSentence(b){var m=String(b||'').match(/^[^.!?]*[.!?]/);return m?m[0]:(b||'');}

  function renderSlide(){
    if(!items.length){
      slideEl.innerHTML='<div class="empty"><div class="big">The sky isn\'t dark yet 🌇</div><p>Deep-sky objects appear here once the sun is down. For now, ask us about the Moon and the bright planets — and step up to a telescope.</p></div>';
      fillEl.style.width='0%';return;
    }
    if(idx>=items.length)idx=0;
    var it=items[idx], sp=it.sp, p=it.p;
    slideEl.innerHTML='<div class="art">'+A.illus(sp, 320)+'</div>'
      +'<div class="info">'
      +'<div class="kicker">Now in the sky · '+(sp.kind==='planet'?'Planet':sp.kind==='moon'?'The Moon':sp.kind==='dso'?'Deep-sky':sp.kind==='double'?'Double star':sp.kind==='comet'?'Comet':'Star')+'</div>'
      +'<div class="name">'+sp.name+'</div>'
      +'<div class="where">'+altWord(p.alt).replace(/^\w/,function(c){return c.toUpperCase();})+' in the <span class="deg">'+A.compass(p.az)+'</span> · <span class="deg">'+Math.round(p.alt)+'°</span> up</div>'
      +'<div class="blurb">'+firstSentence(sp.blurb)+'</div>'
      +(sp.scope?'<div class="scope">🔭 '+sp.scope+'</div>':'')
      +'</div>';
    fillEl.style.width='0%';
    // kick the progress animation
    requestAnimationFrame(function(){requestAnimationFrame(function(){fillEl.style.transition='width '+SLIDE_MS+'ms linear';fillEl.style.width='100%';});});
  }
  function go(n){idx=(n+ (items.length||1))%(items.length||1);fillEl.style.transition='none';renderSlide();restart();}
  function nextSlide(){go(idx+1);}
  function prevSlide(){go(idx-1);}
  function restart(){if(timer)clearTimeout(timer);if(playing&&items.length>1)timer=setTimeout(nextSlide,SLIDE_MS);}
  function setPlaying(p){playing=p;document.getElementById('play').textContent=p?'⏸':'▶';restart();}

  function refreshData(keep){
    var newItems=compute();
    var curId=items[idx]&&items[idx].sp.id;
    items=newItems;
    if(keep&&curId){var j=items.findIndex(function(x){return x.sp.id===curId;});idx=j>=0?j:0;}else idx=0;
    renderSlide();restart();
  }

  document.getElementById('next').addEventListener('click',nextSlide);
  document.getElementById('prev').addEventListener('click',prevSlide);
  document.getElementById('play').addEventListener('click',function(){setPlaying(!playing);});
  document.getElementById('full').addEventListener('click',function(){
    try{ if(!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
         else if(document.exitFullscreen) document.exitFullscreen(); }catch(e){} });
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight')nextSlide(); else if(e.key==='ArrowLeft')prevSlide();
    else if(e.key===' '){e.preventDefault();setPlaying(!playing);} });

  function clock(){var t=sgtNow();var hh=t.getHours(),mm=t.getMinutes();document.getElementById('clock').textContent=(hh%12||12)+':'+(mm<10?'0':'')+mm+' '+(hh<12?'AM':'PM');}
  function rotateTick(){tickI=(tickI+1)%TICKS.length;tickEl.innerHTML=TICKS[tickI];}

  // boot
  refreshData(false);
  clock(); setInterval(clock,20000);
  tickTimer=setInterval(rotateTick,SLIDE_MS); // rotate footer in step-ish with slides
  setInterval(function(){refreshData(true);},300000); // recompute positions every 5 min
  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
</script>
<script src="version.js"></script>
</body>
</html>
