name: Deploy SCOB Night-Sky to GitHub Pages

# Publishes the site to GitHub Pages on every push to the main branch.
# One-time setup: repo → Settings → Pages → "Build and deployment" → Source: GitHub Actions.
# After that, "publishing" is just your normal `git push` — this workflow does the rest.

on:
  push:
    branches: [main]        # change to "master" if that's your default branch
  workflow_dispatch:         # lets you trigger a deploy manually from the Actions tab

# Permissions required by the official Pages deploy actions
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; a newer push cancels an in-progress one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Astronomy regression test
        run: |
          if [ -f test-astro.js ]; then node test-astro.js; else echo "test-astro.js not present — skipping."; fi

      - name: Page smoke tests
        run: |
          if [ -f test-pages.js ]; then node test-pages.js; else echo "test-pages.js not present — skipping."; fi

      - name: Interactive-logic regression tests
        run: |
          if [ -f test-logic.js ]; then node test-logic.js; else echo "test-logic.js not present — skipping."; fi

      - name: Real-browser smoke test (headless Chromium)
        run: |
          if [ -f test-browser.js ]; then
            npm i -D playwright@1.55.0
            npx playwright install --with-deps chromium
            node test-browser.js
          else
            echo "test-browser.js not present — skipping the real-browser smoke test."
          fi

      - name: Pre-flight release check (optional gate)
        run: |
          if [ -f check-release.sh ]; then
            chmod +x check-release.sh
            ./check-release.sh
          else
            echo "check-release.sh not present — skipping the version/link consistency check."
          fi

      - name: Stage the live site (web files only)
        run: |
          mkdir -p _site
          # Copy just the web assets — non-web files (deck .pptx, briefings, README,
          # scripts, archive/) are NOT published. New .html/.js pages are picked up
          # automatically; add patterns here if you introduce new asset types.
          cp -v *.html          _site/ 2>/dev/null || true
          cp -v *.js            _site/ 2>/dev/null || true
          cp -v *.css           _site/ 2>/dev/null || true
          cp -v *.webmanifest   _site/ 2>/dev/null || true
          cp -v icon-*.png      _site/ 2>/dev/null || true
          # Share image, sitemap and robots (referenced by the pages' Open Graph tags).
          cp -v og-image.png robots.txt sitemap.xml _site/ 2>/dev/null || true
          # Data files the pages fetch at runtime. nea-haze.json is the pointer to
          # MSS's current haze satellite image, refreshed by refresh-nea-haze.yml;
          # without this line the haze page's NEA layer has nothing to read.
          cp -v nea-haze.json   _site/ 2>/dev/null || true
          # Dev-only scripts must never reach the live site.
          rm -f _site/test-astro.js _site/test-logic.js _site/test-pages.js _site/test-browser.js _site/migrate-theme.js
          # Make the bare site URL open the dashboard directly.
          if [ -f scob-dashboard-v3.html ]; then cp -v scob-dashboard-v3.html _site/index.html; fi
          # Custom domain — written on every build so the GitHub Actions deploy never resets it.
          echo 'afbooster.online' > _site/CNAME
          echo "----- staged for publish -----"
          ls -la _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # v4.15 — check the RESULT, not just that the job ran. From 7 to 15 Oct 2026
      # every run was green while the live haze pointer sat 8 days behind the repo
      # (see refresh-nea-haze.yml). This step reads the live site back and fails the
      # run — which emails the repo owner — if it is not serving what was just built.
      # GitHub Pages sits behind a CDN with a ~10 minute cache, so it polls with a
      # cache-busting query for up to 8 minutes before giving up.
      - name: Verify the live site is serving this build
        run: |
          set -u
          SITE='https://afbooster.online'
          want_ver=$(grep -oE "SCOB_VERSION *= *'[^']+'" version.js | grep -oE "v[0-9.]+")
          want_cap=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('nea-haze.json','utf8')).captured||'')}catch(e){console.log('')}")
          echo "expecting version $want_ver, haze pointer captured $want_cap"
          for i in $(seq 1 16); do
            t=$(date +%s)
            got_ver=$(curl -fsS --max-time 20 "$SITE/version.js?ci=$t" | grep -oE "SCOB_VERSION *= *'[^']+'" | grep -oE "v[0-9.]+" || true)
            got_cap=$(curl -fsS --max-time 20 "$SITE/nea-haze.json?ci=$t" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).captured||'')}catch(e){console.log('')}})" || true)
            echo "try $i: live version '$got_ver', live pointer '$got_cap'"
            if [ "$got_ver" = "$want_ver" ] && { [ -z "$want_cap" ] || [ "$got_cap" = "$want_cap" ]; }; then
              echo "live site matches this build"; exit 0
            fi
            sleep 30
          done
          echo "::error::the live site is not serving this build after 8 minutes (version '$got_ver' vs '$want_ver', haze pointer '$got_cap' vs '$want_cap')"
          exit 1
