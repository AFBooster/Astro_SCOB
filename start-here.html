function T(k,o){var s=(S[lang]&&S[lang][k]!=null)?S[lang][k]:S.en[k];if(o)for(var p in o)s=s.split('{'+p+'}').join(o[p]);return s;}
function L(o){return o[lang]||o.en;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var $=function(id){return document.getElementById(id);};
function hits(){
  var q=$('q').value.trim(),box=$('hits');
  if(!q){box.innerHTML='';return;}
  var r=window.SCOBSearch?window.SCOBSearch.find(q):[];
  var I=(lang!=='en'&&window.SCOBI18N)?window.SCOBI18N:null;
  box.innerHTML=r.length?r.slice(0,6).map(function(h){var tp=I&&I.page(h.p.f,lang);
      return '<a href="'+h.p.f+'"><div class="t">'+esc(tp?tp.t:h.p.t)+'</div><div class="d">'+esc(tp&&tp.s?tp.s:h.p.d)+'</div></a>';}).join('')
      +(r.length>6?'<a class="more" href="site-map.html?q='+encodeURIComponent(q)+'">'+esc(T('more',{q:q}))+'</a>':'')
    :'<div class="d" style="color:var(--mute);font-size:13px;padding:8px 2px">'+esc(T('none',{q:q}))+'</div>';
}
function render(){
  document.documentElement.lang=lang;
  $('h1').textContent=T('h1');$('lead').textContent=T('lead');
  $('bDash').textContent=T('dash');$('bGuide').textContent=T('guide');$('bAll').textContent=T('all');
  $('q').placeholder=T('ph');$('q').setAttribute('aria-label',T('ph'));
  $('langs').innerHTML=LANGS.map(function(l){return '<button type="button" data-l="'+l[0]+'"'+(l[0]===lang?' class="on" aria-pressed="true"':' aria-pressed="false"')+'>'+l[1]+'</button>';}).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#langs button'),function(b){b.onclick=function(){lang=b.getAttribute('data-l');try{localStorage.setItem('scobSiteLang',lang);}catch(e){}render();};});
  $('paths').innerHTML=PATHS.map(function(p){
    return '<section class="path" aria-labelledby="'+p[0]+'"><h2 id="'+p[0]+'">'+p[1]+' '+esc(T(p[0]))+'</h2><div class="who">'+esc(T(p[0]+'w'))+'</div>'
      +p[2].map(function(t,i){return '<a href="'+t[0]+'"><span class="em" aria-hidden="true">'+t[1]+'</span><span><span class="tl"><span class="n">'+(i+1)+'</span>'+esc(L(t[2]))+'</span><span class="ds">'+esc(L(t[3]))+'</span></span></a>';}).join('')
      +'</section>';
  }).join('');
  $('foot').innerHTML=esc(T('foot'))+'<br><a href="about.html">About &amp; credits</a> · <a href="site-map.html">'+esc(T('all').replace(/^\S+\s/,''))+'</a> · <span class="scob-version" style="opacity:.75"></span>';
  if(window.SCOB_VERSION){var sv=document.querySelector('.scob-version');if(sv)sv.innerHTML='SCOB Night-Sky <b>'+window.SCOB_VERSION+'</b> · '+(window.SCOB_COPYRIGHT||'');}
  if(window.ComeTonight)window.ComeTonight.render($('comeTonight'),lang);
  hits();
}
$('q').addEventListener('input',hits);
render();
